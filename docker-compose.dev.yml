# Local development stack.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#   open http://localhost:8000
#
# Optional demo data:
#   docker compose -f docker-compose.dev.yml --profile seed run --rm seed
#
# Requires a root .env (copy from .env.example) with LiveKit, Deepgram,
# OpenRouter, DATABASE_URL, and JWT_SECRET.

name: voice-agent-dev

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent-base
    command: ["node", "scripts/migrate.js"]
    env_file:
      - .env
    restart: "no"
    networks:
      - voice-agent-local

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_LIVEKIT_URL: ${LIVEKIT_URL}
        VITE_API_BASE: http://localhost:8000
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SERVE_FRONTEND: "1"
      PORT: 8000
      TRUST_PROXY: "0"
      CORS_ORIGINS: http://localhost:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - voice-agent-local

  agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - voice-agent-local

  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: Dockerfile
      target: agent-base
    command: ["node", "scripts/seed.js"]
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - voice-agent-local

networks:
  voice-agent-local:
    driver: bridge
