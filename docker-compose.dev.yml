# Local development stack.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#   open http://localhost:8000
#
# Optional demo data:
#   docker compose -f docker-compose.dev.yml --profile seed run --rm seed
#
# Requires a root .env (copy from .env.example) with LiveKit, Deepgram,
# OpenRouter, and JWT_SECRET. POSTGRES_* is set automatically below.

name: voice-agent-dev

x-db-environment: &db-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: voiceagent
  POSTGRES_PASSWORD: voiceagent
  POSTGRES_DB: voiceagent

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voiceagent
      POSTGRES_PASSWORD: voiceagent
      POSTGRES_DB: voiceagent
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceagent"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - voice-agent-local

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent-base
    command: ["node", "scripts/migrate.js"]
    env_file:
      - .env
    environment:
      <<: *db-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - voice-agent-local

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_LIVEKIT_URL: ${LIVEKIT_URL}
        VITE_API_BASE: http://localhost:8000
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SERVE_FRONTEND: "1"
      PORT: 8000
      TRUST_PROXY: "0"
      CORS_ORIGINS: http://localhost:8000
      <<: *db-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - voice-agent-local

  agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent
    env_file:
      - .env
    environment:
      NODE_ENV: production
      <<: *db-environment
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - voice-agent-local

  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: Dockerfile
      target: agent-base
    command: ["node", "scripts/seed.js"]
    env_file:
      - .env
    environment:
      <<: *db-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - voice-agent-local

networks:
  voice-agent-local:
    driver: bridge

volumes:
  postgres_dev_data:
