<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f1424"/>
      <stop offset="1" stop-color="#1a1040"/>
    </linearGradient>
    <radialGradient id="glow" cx="16" cy="16" r="14" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb" x1="10" y1="8" x2="22" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.45" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="core" x1="13" y1="12" x2="19" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- App icon background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <circle cx="16" cy="16" r="13" fill="url(#glow)"/>

  <!-- Outer voice ring -->
  <circle cx="16" cy="16" r="11.5" stroke="url(#orb)" stroke-width="1.2" stroke-opacity="0.45" fill="none"/>

  <!-- Main orb -->
  <circle cx="16" cy="16" r="8.5" fill="url(#orb)"/>

  <!-- Highlight core -->
  <circle cx="16" cy="16" r="3.2" fill="url(#core)"/>

  <!-- Sound wave arcs -->
  <path d="M8.5 21.5C9.8 19.2 12.4 17.5 16 17.5C19.6 17.5 22.2 19.2 23.5 21.5" stroke="#22d3ee" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.7"/>
  <path d="M6.5 23.5C8.4 20.1 11.8 17.8 16 17.8C20.2 17.8 23.6 20.1 25.5 23.5" stroke="#a855f7" stroke-width="0.9" stroke-linecap="round" stroke-opacity="0.45"/>
</svg>
