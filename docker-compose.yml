name: voice-agent

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent-base
    command: ["node", "scripts/migrate.js"]
    env_file:
      - .env
    restart: "no"
    networks:
      - divescale-net

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_LIVEKIT_URL: ${LIVEKIT_URL}
        VITE_API_BASE: ""
    # Remove the ports mapping since nginx will handle routing
    # ports:
    #   - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SERVE_FRONTEND: "1"
      PORT: 8000
      TRUST_PROXY: "1"
      CORS_ORIGINS: https://voice-assist.duckdns.org
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - divescale-net

  agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - divescale-net

  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: Dockerfile
      target: agent-base
    command: ["node", "scripts/seed.js"]
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - divescale-net

networks:
  divescale-net:
    external: true