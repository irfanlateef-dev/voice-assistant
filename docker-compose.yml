name: voice-agent

x-db-environment: &db-environment
  # Unique host alias — avoids clashing with other "postgres" services on divescale-net
  POSTGRES_HOST: voice-agent-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: voiceagent
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voiceagent}
  POSTGRES_DB: voiceagent

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voiceagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voiceagent}
      POSTGRES_DB: voiceagent
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceagent"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      divescale-net:
        aliases:
          - voice-agent-postgres

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent-base
    command: ["node", "scripts/migrate.js"]
    env_file:
      - .env
    environment:
      <<: *db-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - divescale-net

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_LIVEKIT_URL: ${LIVEKIT_URL}
        VITE_API_BASE: ""
    # Remove the ports mapping since nginx will handle routing
    # ports:
    #   - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SERVE_FRONTEND: "1"
      PORT: 8000
      TRUST_PROXY: "1"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://assistantchef.cc,https://www.assistantchef.cc}
      <<: *db-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - divescale-net

  agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent
    env_file:
      - .env
    environment:
      NODE_ENV: production
      <<: *db-environment
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - divescale-net

  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: Dockerfile
      target: agent-base
    command: ["node", "scripts/seed.js"]
    env_file:
      - .env
    environment:
      <<: *db-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - divescale-net

networks:
  divescale-net:
    external: true

volumes:
  postgres_prod_data:
